<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 50px; }
        textarea { width: 80%; height: 100px; padding: 10px; font-size: 1em; }
        button { padding: 10px 20px; margin-top: 10px; font-size: 1em; cursor: pointer; }
        #result { margin-top: 20px; font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Fake News Detector</h2>
    <textarea id="newsText" placeholder="Enter news text..."></textarea>
    <br>
    <button onclick="predict()">Check News</button>
    <div id="result"></div>

    <script>
        function predict() {
            const newsText = document.getElementById("newsText").value;
            fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: newsText })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("result").innerHTML = "Prediction: " + data.prediction;
            })
            .catch(error => {
                console.error("Error:", error);
                document.getElementById("result").innerHTML = "Error: Could not get prediction.";
            });
        }
    </script>
</body>
</html>
