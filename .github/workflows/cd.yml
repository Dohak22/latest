name: CD
 
on:
  push:
    branches: [ my-feature-branch ]
 
jobs:
  deploy:
    runs-on: ubuntu-latest
 
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
 
    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
 
    - name: Add SSH known hosts
      run: |
        ssh-keyscan -H ${{ secrets.SERVER_ID }} >> ~/.ssh/known_hosts
 
    - name: SSH into the server, build and deploy Docker container
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVERUSER }}@${{ secrets.SERVER_ID }} << 'EOF'
          cd "c:\Users\Doha\OneDrive\Documents\M2\Dc khodor\start"
          git pull origin my-feature-branch
          docker build -t fake-news-app:${{ github.sha }} .
          docker stop fake-news-app || true
          docker rm fake-news-app || true
          docker run -d --name fake-news-app -p 80:80 fake-news-app:${{ github.sha }}
        EOF