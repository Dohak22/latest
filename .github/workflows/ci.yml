name: CI
 
on:
  push:
    branches: [ my-feature-branch ]
  pull_request:
    branches: [ my-feature-branch ]
 
jobs:
  build-test:
    runs-on: ubuntu-latest
 
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
 
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
 
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask nltk scikit-learn
 
    - name: Download NLTK stopwords
      run: python -c "import nltk; nltk.download('stopwords')"
 
    - name: Check Flask app runs
      run: |
        python C:\Users\Doha\OneDrive\Documents\M2\Dc khodor\news\Backend\app.py &
        sleep 5
        curl --fail http://127.0.0.1:5000 || exit 1